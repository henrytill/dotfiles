<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!-- None of these fonts have a bold face, so 90-synthetic.conf sets embolden.
       cairo honours that and fakes a bold; libXft ignores it. -->
  <!-- Overriding embolden here would not work: 50-user.conf includes this dir
       at position 50, and fontconfig applies includes inline, so 90-synthetic
       still runs afterwards.  Lowering the requested weight at pattern time
       instead makes its test fail outright, which is order-independent. -->
  <!-- The tests are substring matches so that the Px/Mx variants and the
       Unifont Upper/Sample/CSUR/JP siblings are all covered at once.  A font
       installed later whose name contains these strings gets swept in too,
       even if it does have a real bold face. -->
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>IBM VGA</string>
    </test>
    <edit name="weight" mode="assign">
      <const>regular</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>Unifont</string>
    </test>
    <edit name="weight" mode="assign">
      <const>regular</const>
    </edit>
  </match>
</fontconfig>
