<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <match target="font">
    <test name="family" qual="any" compare="eq">
      <string>Unifont</string>
    </test>
    <edit mode="assign" name="antialias">
      <bool>false</bool>
    </edit>
  </match>
  <!-- None of these fonts have a bold face, so 90-synthetic.conf sets embolden.
       cairo and fcft honour that and fake a bold; libXft ignores it. -->
  <!-- Overriding embolden here would not work: 50-user.conf includes this file
       at position 50, and fontconfig applies includes inline, so 90-synthetic
       still runs afterwards.  Lowering the requested weight at pattern time
       instead makes its test fail outright, which is order-independent. -->
  <!-- The tests are substring matches so that the Px/Mx variants and the
       Unifont Upper/Sample/CSUR/JP siblings are all covered at once.  A font
       installed later whose name contains these strings gets swept in too,
       even if it does have a real bold face. -->
  <!-- NB: this only reaches consumers that take their synthetic bold from
       fontconfig.  Some never read the embolden flag at all: they compare the
       weight a face asked for against the weight of the font they actually
       opened, and overstrike in their own drawing code when those differ.
       Nothing here can affect that, since the requested weight is theirs, not
       fontconfig's.  Such consumers have to be told not to on their own terms.
       The antialias flag above is read far more widely, so the two stanzas do
       not reach the same set of programs. -->
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>IBM VGA</string>
    </test>
    <edit mode="assign" name="weight">
      <const>regular</const>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="contains">
      <string>Unifont</string>
    </test>
    <edit mode="assign" name="weight">
      <const>regular</const>
    </edit>
  </match>
</fontconfig>
